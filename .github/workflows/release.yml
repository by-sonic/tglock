name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS universal
            os: macos-14
            args: --bundles app,dmg --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: Windows x64
            os: windows-latest
            args: --bundles nsis --target x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
          - platform: Linux x64
            os: ubuntu-22.04
            args: --bundles appimage,deb --target x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: TGLock v__VERSION__
          releaseBody: |
            Новый TGLock: адаптивный MTProto/WebSocket-транспорт и полностью обновлённый интерфейс на Tauri 2.

            - macOS: скачайте универсальный `.dmg` или `.app.tar.gz`
            - Windows: скачайте `.exe` установщик
            - Linux: скачайте `.AppImage` или `.deb`
            - Сервер или машина без монитора: скачайте `tglock-cli-*` — там нет графического интерфейса
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Смотрит внутрь собранного бандла. v2.0.0-beta.2 опубликовался с зелёным
      # CI, хотя .app и .deb содержали headless CLI вместо приложения: сборка
      # была успешной, просто никто не проверял, что внутри.
      - name: The bundle must contain the GUI binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find target -maxdepth 6 -name 'TGLock.app' -type d | head -1)
          test -n "$app" || { echo "TGLock.app не найден"; exit 1; }
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          echo "CFBundleExecutable = $exe"
          test "$exe" = "tglock" || { echo "в бандле не GUI-бинарь"; exit 1; }
          test -x "$app/Contents/MacOS/tglock" || { echo "исполняемый файл отсутствует"; exit 1; }

      - name: The bundle must contain the GUI binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb=$(find target -maxdepth 6 -name '*.deb' | head -1)
          test -n "$deb" || { echo ".deb не найден"; exit 1; }
          dpkg-deb -c "$deb" | grep -E ' \./usr/bin/tglock$' \
            || { echo "в .deb нет /usr/bin/tglock:"; dpkg-deb -c "$deb" | grep '/bin/'; exit 1; }

  cli:
    name: Headless CLI ${{ matrix.platform }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS universal
            os: macos-14
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            asset: tglock-cli-universal-apple-darwin
          - platform: Windows x64
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            asset: tglock-cli-x86_64-pc-windows-msvc.exe
          - platform: Linux x64
            os: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            asset: tglock-cli-x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      # No Node.js and no desktop libraries: the CLI must build without them.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Build (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          IFS=',' read -ra targets <<< "${{ matrix.rust-targets }}"
          binaries=()
          for target in "${targets[@]}"; do
            cargo build --release --locked --no-default-features \
              --bin tglock-cli --target "$target"
            binaries+=("target/$target/release/tglock-cli")
          done
          if [ "${#binaries[@]}" -gt 1 ]; then
            lipo -create -output "${{ matrix.asset }}" "${binaries[@]}"
          else
            cp "${binaries[0]}" "${{ matrix.asset }}"
          fi
          chmod +x "${{ matrix.asset }}"
          ./"${{ matrix.asset }}" --version

      - name: Build (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked --no-default-features \
            --bin tglock-cli --target ${{ matrix.rust-targets }}
          cp "target/${{ matrix.rust-targets }}/release/tglock-cli.exe" "${{ matrix.asset }}"
          ./"${{ matrix.asset }}" --version

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: false
          files: ${{ matrix.asset }}
