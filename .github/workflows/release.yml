name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS universal
            os: macos-14
            args: --bundles app,dmg --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: Windows x64
            os: windows-latest
            args: --bundles nsis --target x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
          - platform: Linux x64
            os: ubuntu-22.04
            args: --bundles appimage,deb --target x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: TGLock v__VERSION__
          releaseBody: |
            Новый TGLock: адаптивный MTProto/WebSocket-транспорт и полностью обновлённый интерфейс на Tauri 2.

            - macOS: скачайте универсальный `.dmg` или `.app.tar.gz`
            - Windows: скачайте `.exe` установщик
            - Linux: скачайте `.AppImage` или `.deb`
            - Сервер или машина без монитора: скачайте `tglock-cli-*` — там нет графического интерфейса
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Проверяет СОДЕРЖИМОЕ упакованного бинаря, а не его имя.
      #
      # v2.0.0-beta.2 и v2.0.0-beta.3 опубликовались с зелёным CI, хотя в бандле
      # лежал headless CLI вместо приложения. В beta.3 имя файла было уже
      # правильным — переименованным — поэтому проверка имени прошла. Отличить
      # можно только по содержимому: `wry`/`ipc.localhost` есть исключительно в
      # GUI, а `allow-direct` — исключительно в CLI.
      - name: The bundled binary must actually be the GUI one
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find target -maxdepth 6 -name 'TGLock.app' -type d | head -1)
          test -n "$app" || { echo "TGLock.app не найден"; exit 1; }
          exe="$app/Contents/MacOS/tglock"
          test -f "$exe" || { echo "нет $exe:"; ls -la "$app/Contents/MacOS/"; exit 1; }
          ls -la "$exe"
          if ! grep -qa 'ipc\.localhost' "$exe"; then
            echo "в бандле не GUI: отсутствует признак ipc.localhost"; exit 1
          fi
          if grep -qa 'allow-direct' "$exe"; then
            echo "в бандле оказался headless CLI: найден признак allow-direct"; exit 1
          fi
          echo "OK: в бандле GUI-бинарь"

      - name: The bundled binary must actually be the GUI one
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb=$(find target -maxdepth 6 -name '*.deb' | head -1)
          test -n "$deb" || { echo ".deb не найден"; exit 1; }
          root=$(mktemp -d)
          dpkg-deb -x "$deb" "$root"
          exe="$root/usr/bin/tglock"
          test -f "$exe" || { echo "нет /usr/bin/tglock:"; dpkg-deb -c "$deb" | grep '/bin/'; exit 1; }
          ls -la "$exe"
          if ! grep -qa 'ipc\.localhost' "$exe"; then
            echo "в .deb не GUI: отсутствует признак ipc.localhost"; exit 1
          fi
          if grep -qa 'allow-direct' "$exe"; then
            echo "в .deb оказался headless CLI: найден признак allow-direct"; exit 1
          fi
          echo "OK: в .deb GUI-бинарь"

  cli:
    name: Headless CLI ${{ matrix.platform }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS universal
            os: macos-14
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            asset: tglock-cli-universal-apple-darwin
          - platform: Windows x64
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            asset: tglock-cli-x86_64-pc-windows-msvc.exe
          - platform: Linux x64
            os: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            asset: tglock-cli-x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      # No Node.js and no desktop libraries: the CLI must build without them.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Build (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          IFS=',' read -ra targets <<< "${{ matrix.rust-targets }}"
          binaries=()
          for target in "${targets[@]}"; do
            cargo build --release --locked --no-default-features --features cli \
              --bin tglock-cli --target "$target"
            binaries+=("target/$target/release/tglock-cli")
          done
          if [ "${#binaries[@]}" -gt 1 ]; then
            lipo -create -output "${{ matrix.asset }}" "${binaries[@]}"
          else
            cp "${binaries[0]}" "${{ matrix.asset }}"
          fi
          chmod +x "${{ matrix.asset }}"
          ./"${{ matrix.asset }}" --version

      - name: Build (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked --no-default-features --features cli \
            --bin tglock-cli --target ${{ matrix.rust-targets }}
          cp "target/${{ matrix.rust-targets }}/release/tglock-cli.exe" "${{ matrix.asset }}"
          ./"${{ matrix.asset }}" --version

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: false
          files: ${{ matrix.asset }}
