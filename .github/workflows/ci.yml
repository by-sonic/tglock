name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: npm ci && npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Оба бинаря лежат в одном крейте, и бандлер Tauri без явного указания
      # может взять headless CLI как главный исполняемый файл приложения.
      # Именно это уехало в v2.0.0-beta.2: .app и .deb содержали tglock-cli, и
      # приложение не открывалось ни на одной платформе.
      - name: Main binary of the bundle must be the GUI one
        run: |
          node -e "
          const fs = require('fs');
          const conf = JSON.parse(fs.readFileSync('tauri.conf.json', 'utf8'));
          const toml = fs.readFileSync('Cargo.toml', 'utf8');
          const gui = toml.split('[[bin]]').slice(1)
            .find(b => /required-features\s*=\s*\[\s*\"gui\"\s*\]/.test(b));
          if (!gui) throw new Error('не найден [[bin]] с required-features = [\"gui\"]');
          const name = (gui.match(/name\s*=\s*\"([^\"]+)\"/) || [])[1];
          if (conf.mainBinaryName !== name) {
            throw new Error('mainBinaryName=' + conf.mainBinaryName + ', а GUI-бинарь называется ' + name);
          }
          console.log('mainBinaryName указывает на GUI-бинарь:', name);
          "

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  bundle:
    name: Bundled app must be the GUI binary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # Явный --target обязателен: без него бандлер выбирал правильный бинарь, а
      # с ним — нет, и именно так beta.2 и beta.3 уехали с headless CLI внутри.
      - name: Bundle the app
        run: npx tauri build --bundles app --target aarch64-apple-darwin

      # Проверяется содержимое, а не имя файла. В beta.3 имя было уже
      # правильным, потому что бандлер переименовал CLI, и проверка имени
      # ничего не заметила.
      - name: The bundled binary must actually be the GUI one
        run: |
          exe=$(find target -maxdepth 8 -path '*TGLock.app/Contents/MacOS/tglock' | head -1)
          test -n "$exe" || { echo "исполняемый файл бандла не найден"; find target -maxdepth 6 -name 'TGLock.app'; exit 1; }
          python3 scripts/verify_bundle_binary.py "$exe"

  headless:
    name: Headless CLI (no WebView, no Node)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # This job deliberately installs no Node.js, no frontend and no
      # libwebkit2gtk. It fails the moment anything drags the GUI back into the
      # headless build, which is the whole point of issues #10 and #17.
      - name: Lint
        run: cargo clippy --no-default-features --features cli --all-targets -- -D warnings

      - name: Test
        run: cargo test --no-default-features --features cli --lib --bins

      - name: Build
        run: cargo build --release --no-default-features --features cli --bin tglock-cli

      - name: Start, advertise a proxy link and stop on SIGTERM
        run: |
          ./target/release/tglock-cli --help
          ./target/release/tglock-cli --version
          # --preserve-status makes this assert the shutdown path: a handled
          # SIGTERM exits 0, an unhandled one would surface as 143 and fail.
          timeout --preserve-status --signal=TERM 5 \
            ./target/release/tglock-cli --port 18080 --secret-file "$PWD/secret" > cli.log 2>&1
          cat cli.log
          grep -q 'tg://proxy' cli.log
          grep -q '127.0.0.1:18080' cli.log
          test "$(stat -c '%a' "$PWD/secret")" = 600

      - name: Keep the same proxy link across a restart
        run: |
          first=$(grep -o 'secret=[0-9a-f]*' cli.log)
          timeout --preserve-status --signal=TERM 5 \
            ./target/release/tglock-cli --port 18080 --secret-file "$PWD/secret" > restart.log 2>&1
          test "$first" = "$(grep -o 'secret=[0-9a-f]*' restart.log)"

      # Настройки из файла и приоритет флага над файлом.
      - name: Read settings from a file
        run: |
          cat > tglock.toml <<'CONF'
          port = 18090
          secret = "dd00112233445566778899aabbccddeeff"
          worker = ["example.workers.dev"]
          CONF
          timeout --preserve-status --signal=TERM 5 \
            ./target/release/tglock-cli --config tglock.toml > conf.log 2>&1
          cat conf.log
          grep -q '127.0.0.1:18090' conf.log
          grep -q 'secret=dd00112233445566778899aabbccddeeff' conf.log
          grep -q 'example.workers.dev' conf.log
          # Флаг должен перекрывать файл.
          timeout --preserve-status --signal=TERM 5 \
            ./target/release/tglock-cli --config tglock.toml --port 18091 > over.log 2>&1
          grep -q '127.0.0.1:18091' over.log
          # Опечатка в файле обязана быть ошибкой, а не молчаливым дефолтом.
          echo 'porrt = 1443' > bad.toml
          if ./target/release/tglock-cli --config bad.toml; then
            echo "опечатка в конфиге прошла незамеченной"; exit 1
          fi

      # Закрытый stdout не должен ронять демон: println! при ошибке записи
      # паникует, а канал закрывается штатно — `| head`, закрытый терминал,
      # перезапуск сборщика логов.
      - name: Survive a closed stdout
        run: |
          set +e
          timeout --signal=TERM 5 ./target/release/tglock-cli --port 18092 2> pipe-err.log | head -2
          set -e
          cat pipe-err.log
          if grep -qi 'panic' pipe-err.log; then
            echo "демон упал из-за закрытого stdout"; exit 1
          fi

  msrv:
    name: Rust 1.88 compatibility
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: npm ci && npm run build

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Check locked dependency graph
        run: cargo check --locked

      - name: Check the headless dependency graph too
        run: cargo check --locked --no-default-features --features cli --lib --bins

  frontend:
    name: Frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Type-check and build
        run: npm ci && npm run build
